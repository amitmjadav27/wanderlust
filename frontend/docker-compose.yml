version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend  # Adjust the Dockerfile name if it's different
    ports:
      - "5000:5000"  # Expose backend port (make sure this matches your app's config)
    environment:
      - NODE_ENV=production
    env_file:
      - .env.docker  # Assuming you have a .env.docker file for environment variables
    networks:
      - app-network

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend  # Adjust the Dockerfile name if it's different
    ports:
      - "5173:5173"  # Expose frontend port (make sure this matches your app's config)
    environment:
      - NODE_ENV=production
    env_file:
      - .env.docker  # Assuming you have a .env.docker file for environment variables
    networks:
      - app-network
    depends_on:
      - backend  # Ensures frontend starts after backend (optional, not critical for most cases)

# Define networks for inter-container communication
networks:
  app-network:
    driver: bridge
